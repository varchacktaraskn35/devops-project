name: CI/CD

on:
  push:
    branches: [main]

env:
  APP_DIR: students/varchack/app
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/devops-project

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "Branch: ${GITHUB_REF_NAME}, tag: ${GITHUB_SHA::7}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Find EC2 created by Terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          HOST=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=devops-project" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          if [ -z "$HOST" ] || [ "$HOST" = "None" ]; then
            echo "No running instance tagged devops-project. Run terraform apply first." && exit 1
          fi
          echo "EC2_HOST=$HOST" >> "$GITHUB_ENV"

      - name: Decode SSH key
        env:
          SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
        run: |
          printf '%s' "$SSH_KEY_B64" | tr -d '[:space:]' | base64 -d > ec2-key.pem
          chmod 600 ec2-key.pem

      - name: Deploy container to EC2
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          TAG: ${{ env.IMAGE_TAG }}
        run: |
          for i in $(seq 1 12); do
            ssh -i ec2-key.pem -o StrictHostKeyChecking=no -o ConnectTimeout=10 ubuntu@$EC2_HOST 'sudo docker --version' && break
            echo "Waiting for EC2 / Docker (attempt $i)..."; sleep 10
          done
          ssh -i ec2-key.pem -o StrictHostKeyChecking=no ubuntu@$EC2_HOST << EOF
            sudo docker rm -f nodeapp || true
            sudo docker pull $IMAGE
            sudo docker run -d --name nodeapp --restart unless-stopped -p 3000:3000 -e APP_VERSION=$TAG $IMAGE
          EOF

      - name: Smoke test
        run: |
          sleep 5
          curl -fsS --retry 5 --retry-delay 3 http://$EC2_HOST:3000/health
